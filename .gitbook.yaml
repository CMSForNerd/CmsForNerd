# GitBook configuration version
version: "1.0.0"

# Defines the root directory of your content (change to ./docs if using a subfolder)
root: ./

# Maps core structural files
structure:
  readme: README.md
  summary: SUMMARY.md

# This tells GitBook which files to ignore when building the docs
# We ignore the core PHP engine so the documentation stays clean
projects:
  - content:
      ignore:
        - vendor/*
        - includes/*
        - themes/*
        - contents/*
        - "*.php"

# Redirects and customization
redirects:
  /lab-manual: /LAB-GUIDE.md
