name: Bake PHP to Static HTML
on:
  push:
    branches: [ "master" ] # Updated to match your 'master' branch

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl # Ensures required extensions are present

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --ignore-platform-reqs

      - name: Start Local PHP Server
        run: php -S 127.0.0.1:8000 & # Run in background

      - name: Staticize (Bake) All PHP Pages
        run: |
          sleep 3 # Extra second to ensure server is fully ready
          php tools/bake-static-pages.php build_static

      - name: Upload Static Files
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build_static' # Uploads only the self-contained baked static files

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
