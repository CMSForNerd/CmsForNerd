# ==============================================================================
# Protocol    : Deep State of Mind (DSOM) Security & SAST Integration
# Author      : Harisfazillah Jamel (LinuxMalaysia)
# Description : Automated SAST, Secret Scanning (Gitleaks), and PHP Static Security
# ==============================================================================
name: Security SAST & Secret Scanning

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '>=1.22'

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@latest

      - name: Run Gitleaks
        run: $(go env GOPATH)/bin/gitleaks detect --no-git --config=.gitleaks.toml --verbose

  sast-phpstan:
    name: PHPStan Static Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan SAST
        run: vendor/bin/phpstan analyze --memory-limit=512M
