# ==============================================================================
# Protocol    : Deep State of Mind (DSOM) Security & SAST Integration
# Author      : Harisfazilled Jamel (LinuxMalaysia)
# Description : Automated SAST, Secret Scanning (Gitleaks), and PHP Static Security
# ==============================================================================
name: Security SAST & Secret Scanning

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-phpstan:
    name: PHPStan Static Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan SAST
        run: vendor/bin/phpstan analyze --memory-limit=512M
