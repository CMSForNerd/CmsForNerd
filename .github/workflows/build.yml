name: Build
permissions:
  contents: read
  pull-requests: read
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    if: ${{ secrets.SONAR_TOKEN != '' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarCloud Scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >
            -Dsonar.organization=linuxmalaysia
            -Dsonar.projectKey=linuxmalaysia_CmsForNerd
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.exclusions=**/Dockerfile,**/Containerfile,**/*.css,**/*.js,**/*.html,**/*.xml,**/*.txt,**/LICENSE,**/README.md,**/.git/**,tests/**
            -Dsonar.cpd.exclusions=**/tests/**,tests/**,offline.php,ujian-form.php,tools/sanity-check.php
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
