# Project Identification
sonar.projectKey=linuxmalaysia_CmsForNerd
sonar.organization=linuxmalaysia
sonar.projectName=CmsForNerd
sonar.projectVersion=4.0.0-alpha

# Source Code Encoding
sonar.sourceEncoding=UTF-8

# Source Directories (Default is logical root)
sonar.sources=.

# PHP Configuration
sonar.php.exclusions=**/vendor/**,**/tests/**,**/node_modules/**
sonar.php.version=8.4

# Exclusions (Files to ignore during analysis)
sonar.exclusions=**/Dockerfile,**/Containerfile,**/*.css,**/*.js,**/*.html,**/*.xml,**/*.txt,**/LICENSE,**/README.md,**/.git/**,tests/**

# Copy-Paste Detection (CPD) Exclusions to avoid false positive duplications on tests and static views
sonar.cpd.exclusions=**/tests/**,tests/**,offline.php,ujian-form.php,tools/sanity-check.php

# Test Coverage (Optional - setup later if you add unit tests)
# sonar.php.tests.reportPath=coverage.xml
# sonar.php.coverage.reportPaths=coverage.xml
