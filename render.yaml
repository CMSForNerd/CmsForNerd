services:
  - type: web
    name: cmsfornerd
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: Containerfile
    envVars:
      - key: TZ
        value: Asia/Kuala_Lumpur
      - key: APP_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BYPASS_PHP_CHECK
        value: "1"
